name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      # pgvector/pgvector:pg16, NOT postgres:16 — the stock Postgres image has
      # no `vector` extension available to install, so `create extension vector`
      # in migration 001 fails and every DB-backed test dies at setup.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # A throwaway string, not a secret: every test mocks the Voyage module, so
      # this is only ever read by config validation. Keeping a real key out of
      # CI is deliberate — CI must never be able to spend money.
      VOYAGE_API_KEY: ci-test-key
      VOYAGE_EMBEDDING_MODEL: voyage-3
      OPENROUTER_API_KEY: ci-test-key
      CHAT_MODEL_PROVIDER: openrouter
      CHAT_MODEL_ID: deepseek/deepseek-r1:free
      TOOL_SECRETS_ENCRYPTION_KEY: 3eafa276356c2bcb2f139410c731b4da88aeca1b487b9544fae4b712a5d5a477
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose — package.json's `packageManager` field
      # is the single source of truth, and passing both makes action-setup fail
      # with "Multiple versions of pnpm specified". Railway/Nixpacks reads the
      # same field via corepack, so local, CI and production all agree.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
